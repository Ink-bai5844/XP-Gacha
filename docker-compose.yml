services:
  xp-gacha:
    build: .
    container_name: xp-gacha
    ports:
      - "8501:8501"
      - "8765:8765"
    environment:
      XP_GACHA_BASE_DIR: /library
      LM_STUDIO_API_BASE: http://host.docker.internal:5555/v1
      HISTORY_LINK_TRACKING_HOST: 0.0.0.0
      HISTORY_LINK_TRACKING_PUBLIC_HOST: 127.0.0.1
    volumes:
      - ./.streamlit:/app/.streamlit
      - ./b64_cache:/app/b64_cache
      - ./b64_tmp:/app/b64_tmp
      - ./data:/app/data
      - ./datacache:/app/datacache
      - ./dictionaries:/app/dictionaries
      - ./localimgtmp:/app/localimgtmp
      - ./logs:/app/logs
      - ./manga_vectors:/app/manga_vectors
      - ./models:/app/models
      - ./onlineimgtmp:/app/onlineimgtmp
      # Optional: mount the real manga library here, then set XP_GACHA_BASE_DIR=/library.
      # - H:/动漫资源/漫画集/HMAN:/library:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
